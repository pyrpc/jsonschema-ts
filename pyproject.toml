[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsonschema-ts"
version = "0.1.1"
description = "Convert JSON Schema to TypeScript interfaces (wraps json-schema-to-typescript)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["json-schema", "typescript", "codegen", "pydantic"]

authors = [
    { name = "pyRPC Contributors" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/pyrpc/jsonschema-ts"
Repository = "https://github.com/pyrpc/jsonschema-ts"
Documentation = "https://github.com/pyrpc/jsonschema-ts"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jsonschema_ts"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["jsonschema_ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require Node.js/npx",
]
